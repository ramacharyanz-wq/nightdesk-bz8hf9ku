<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121d33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Recon">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Card Recon</title>
<link rel="stylesheet" href="styles.css?v=20261126f">
<script>try{const t=localStorage.getItem('cr-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" id="mark"></span><b>Card Recon</b></div>
    <div class="date-chip" id="datechip" hidden></div>
    <button class="icon-btn" id="btn-history" aria-label="History" title="History"></button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings"></button>
    <button class="icon-btn" id="btn-theme" aria-label="Switch theme" title="Switch theme"></button>
  </header>

  <section class="slots" aria-label="Files">
    <label class="slot" id="slot-csv"><input type="file" accept=".csv,text/csv" multiple id="in-csv"><span class="ico"></span><span class="txt"><span class="t">Terminal export</span><span class="s">CSV</span></span></label>
    <label class="slot" id="slot-FO"><input type="file" accept=".pdf,application/pdf" id="in-fo"><span class="ico"></span><span class="txt"><span class="t">D140 Front Office</span><span class="s">PDF</span></span></label>
    <label class="slot" id="slot-FB"><input type="file" accept=".pdf,application/pdf" id="in-fb"><span class="ico"></span><span class="txt"><span class="t">D140 F&amp;B</span><span class="s">PDF</span></span></label>
  </section>

  <section class="tray" aria-label="Result"><div class="receipts" id="receipts"></div></section>
  <div id="banners"></div>
  <section class="detail" id="detail" hidden></section>
  <footer class="credit"><span id="credit-mark"></span>Card Recon · Developed by <b>Ram</b></footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" inert role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header><b id="drawer-title"></b><button class="icon-btn" id="drawer-close" aria-label="Close"></button></header><div class="body" id="drawer-body"></div></aside>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="engine.js?v=20261126f"></script>
<script src="report.js?v=20261126f"></script>
<script src="app.js?v=20261126f"></script>
</body>
</html>
