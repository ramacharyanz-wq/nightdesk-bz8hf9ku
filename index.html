<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Privacy lock: files are read on this device only. The browser refuses any network connection from this page
     (connect-src 'none'), any outside script, font or image, and any form submission, so the CSV and D140s can never be sent anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-MalAmVCfyUPvEQjAP4U+JBvYHzCRN8uC7WqPG0X2fEs='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; manifest-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121d33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Recon">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Card Recon</title>
<link rel="stylesheet" href="styles.css?v=20261128a">
<script>try{const t=localStorage.getItem('cr-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" id="mark"></span><b>Card Recon</b></div>
    <div class="date-chip" id="datechip" hidden></div>
    <button class="icon-btn" id="btn-history" aria-label="History" title="History"></button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings"></button>
    <button class="icon-btn" id="btn-theme" aria-label="Switch theme" title="Switch theme"></button>
  </header>

  <section class="slots" aria-label="Files">
    <label class="slot" id="slot-csv"><input type="file" accept=".csv,text/csv" multiple id="in-csv"><span class="ico"></span><span class="txt"><span class="t">Terminal export</span><span class="s">CSV</span></span></label>
    <label class="slot" id="slot-FO"><input type="file" accept=".pdf,application/pdf" id="in-fo"><span class="ico"></span><span class="txt"><span class="t">D140 Front Office</span><span class="s">PDF</span></span></label>
    <label class="slot" id="slot-FB"><input type="file" accept=".pdf,application/pdf" id="in-fb"><span class="ico"></span><span class="txt"><span class="t">D140 F&amp;B</span><span class="s">PDF</span></span></label>
  </section>

  <section class="tray" aria-label="Result"><div class="receipts" id="receipts"></div></section>
  <div id="banners"></div>
  <section class="detail" id="detail" hidden></section>
  <footer class="credit"><span id="credit-mark"></span>Card Recon · Developed by <b>Ram</b></footer>
  <p class="privacy"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Processed on this device only. Nothing is uploaded, and guest and card details are never stored.</p>
  <p class="privacy warn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>Reports from this app hold guest and card details. Share them only with authorised staff in your organisation.</p>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" inert role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header><b id="drawer-title"></b><button class="icon-btn" id="drawer-close" aria-label="Close"></button></header><div class="body" id="drawer-body"></div></aside>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="engine.js?v=20261128a"></script>
<script src="report.js?v=20261128a"></script>
<script src="app.js?v=20261128a"></script>
</body>
</html>
